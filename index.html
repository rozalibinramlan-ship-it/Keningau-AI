<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keningau AI Signal</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; margin-top: 20px;}
        h2 { text-align: center; color: #58a6ff; margin-bottom: 5px; font-size: 24px;}
        p.subtitle { text-align: center; color: #8b949e; font-size: 13px; margin-top: 0; margin-bottom: 25px;}
        button { width: 100%; padding: 15px; background: #238636; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        button:disabled { background: #30363d; cursor: not-allowed; opacity: 0.6; }
        button:active:not(:disabled) { background: #2ea043; transform: scale(0.98); }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px;}
        .header h3 { margin: 0; font-size: 20px; }
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .badge.buy { background: rgba(63, 185, 80, 0.15); color: #3fb950; }
        .badge.sell { background: rgba(248, 81, 73, 0.15); color: #f85149; }
        .row { display: flex; justify-content: space-between; margin: 12px 0; font-size: 15px;}
        .label { color: #8b949e; }
        .val { font-weight: bold; font-family: monospace; font-size: 16px; }
        .tp-color { color: #3fb950; } .sl-color { color: #f85149; }
        .reason { margin-top: 15px; padding: 12px; background: #0d1117; border-radius: 8px; font-style: italic; color: #8b949e; font-size: 13px; border-left: 3px solid #58a6ff;}
        #loading { display: none; text-align: center; color: #e3b341; font-weight: bold; margin-bottom: 20px;}
        #errorBox { display: none; background: rgba(248,81,73,0.1); border: 1px solid #f85149; color: #f85149; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; text-align: center;}
        .footer { text-align: center; font-size: 11px; color: #484f58; margin-top: 15px;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Keningau AI</h2>
        <p class="subtitle">Dikuasakan oleh TwelveData & Groq AI</p>
        <button id="btnSignal" onclick="mintaSignal()">Jana Signal AI</button>
        <div id="loading">AI sedang menganalisis pasaran... (Render mungkin ambil 30s kalau baru bangun)</div>
        <div id="errorBox"></div>
        <div class="card" id="signalCard">
            <div class="header">
                <h3 id="pair">XAU/USD</h3>
                <span class="badge" id="action">...</span>
            </div>
            <div class="row"><span class="label">Entry Price</span><span class="val" id="entry">-</span></div>
            <div class="row"><span class="label">Take Profit (TP1)</span><span class="val tp-color" id="tp1">-</span></div>
            <div class="row"><span class="label">Stop Loss</span><span class="val sl-color" id="sl">-</span></div>
            <div class="row" style="border-top: 1px dashed #30363d; padding-top: 12px;"><span class="label">Confidence Score</span><span class="val" id="confidence">-</span></div>
            <div class="reason">"<span id="reason">-</span>"</div>
            <div class="footer" id="time">-</div>
        </div>
    </div>
    <script>
        // PASTIKAN URL INI ADALAH URL RENDER ANDA
        const API_URL = 'https://keningau-ai.onrender.com/api/generate-signal'; 
        
        async function mintaSignal() {
            const btn = document.getElementById('btnSignal');
            const loading = document.getElementById('loading');
            const card = document.getElementById('signalCard');
            const errorBox = document.getElementById('errorBox');
            
            btn.disabled = true; btn.innerText = "Sedang Jana...";
            loading.style.display = 'block'; card.style.display = 'none'; errorBox.style.display = 'none';

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (!response.ok || data.error) throw new Error(data.error || "API gagal");

                loading.style.display = 'none'; card.style.display = 'block';
                document.getElementById('pair').innerText = data.pair;
                document.getElementById('entry').innerText = data.entry;
                document.getElementById('tp1').innerText = data.tp1;
                document.getElementById('sl').innerText = data.stop_loss;
                document.getElementById('confidence').innerText = data.confidence + " / 100";
                document.getElementById('reason').innerText = data.reason;
                document.getElementById('time').innerText = "Last update: " + new Date().toLocaleString();

                const actionBadge = document.getElementById('action');
                actionBadge.innerText = data.action;
                actionBadge.className = data.action === "BUY" ? "badge buy" : "badge sell";

            } catch (error) {
                loading.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.innerText = "Ralat Sistem: " + error.message;
            } finally {
                btn.disabled = false; btn.innerText = "Jana Signal AI";
            }
        }
    </script>
</body>
</html>
